[PHP]

; ------------------------------------------------------------------------------
; Configuración General y Límites de Memoria
; ------------------------------------------------------------------------------

memory_limit = 256M
max_execution_time = 30
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 32M
default_socket_timeout = 60


; ------------------------------------------------------------------------------
; Seguridad y Visualización de Errores
; ------------------------------------------------------------------------------

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
expose_php = Off
allow_url_fopen = On


; ------------------------------------------------------------------------------
; OPcache
; ------------------------------------------------------------------------------

[opcache]

; Activar OPcache para PHP-FPM
opcache.enable = 1

; No necesitamos OPcache para comandos CLI
opcache.enable_cli = 0

; Memoria destinada a OPcache
opcache.memory_consumption = 128

; Memoria para strings internados
opcache.interned_strings_buffer = 16

; Cantidad máxima de scripts PHP cacheados
opcache.max_accelerated_files = 20000

; Porcentaje máximo de memoria desperdiciada
opcache.max_wasted_percentage = 10

; Producción: no revisar constantemente si los archivos cambiaron
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Laravel utiliza comentarios de PHP
opcache.save_comments = 1

; Optimización de acceso a archivos
opcache.enable_file_override = 1

; JIT desactivado
opcache.jit = off
opcache.jit_buffer_size = 0


; ------------------------------------------------------------------------------
; Sesiones
; ------------------------------------------------------------------------------

[Session]

session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = SAMADHI_SESSID
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 7200
